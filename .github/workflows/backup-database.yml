# Free nightly backup (owner decision 1, 2026-10-31; SECURITY-PLAN §7.1). Supabase Free keeps no backup we can
# restore, so every night this dumps the staging database (roles, schema, data), encrypts it with age to the owner's
# public key (the private key never touches GitHub) and to a restore-test key, and keeps it 30 days as an artifact.
# On the 1st of each month (or on request) it also proves the backup restores: it decrypts with the restore-test key
# into a fresh local database and checks every table's row count against the live project.
# Until the owner has added the keys it runs a self-test with a throwaway key (nothing is kept) so the pipeline is
# still proven. Prints no secrets and no data.
name: Backup database

on:
  schedule:
    - cron: '17 7 * * *'  # 03:17 Port of Spain, nightly
    - cron: '37 8 1 * *'  # 04:37 Port of Spain on the 1st: backup + restore test
  workflow_dispatch:
    inputs:
      restore_test:
        description: Also restore it into a fresh database and compare row counts
        type: boolean
        default: true

concurrency:
  group: backup-database
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-24.04
    environment: staging
    timeout-minutes: 40
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      # Space-separated age public keys: the owner's key and the restore-test key (public keys are not secret).
      RECIPIENTS: ${{ vars.BACKUP_AGE_RECIPIENTS }}
      RESTORE_KEY: ${{ secrets.BACKUP_RESTORE_KEY }}
      RESTORE_TEST: ${{ github.event_name == 'workflow_dispatch' && inputs.restore_test || github.event.schedule == '37 8 1 * *' }}
    steps:
      - uses: actions/checkout@v7
      - name: Staging only
        run: |
          [ "$SUPABASE_PROJECT_REF" = "fmnmylqxrmxuzmdcvmhs" ] || { echo "::error::Backups run against staging only until production exists (SECURITY-PLAN §7.4)."; exit 1; }
      - uses: supabase/setup-cli@v3
        with:
          version: 2.120.0
      - name: Tools (age)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq age postgresql-client > /dev/null
      - name: Keys (or a throwaway self-test key until the owner adds them)
        id: keys
        run: |
          set -euo pipefail
          umask 077
          if [ -n "${RECIPIENTS}" ] && [ -n "${RESTORE_KEY}" ]; then
            printf '%s\n' "$RESTORE_KEY" > /tmp/restore.key
            echo "mode=real" >> "$GITHUB_OUTPUT"
            r=""; for k in $RECIPIENTS; do r="$r -r $k"; done
            echo "args=$r" >> "$GITHUB_OUTPUT"
          else
            age-keygen -o /tmp/restore.key 2>/dev/null
            pub=$(age-keygen -y /tmp/restore.key)
            echo "mode=self-test" >> "$GITHUB_OUTPUT"
            echo "args=-r $pub" >> "$GITHUB_OUTPUT"
            echo "::warning::Backup keys not set up yet (variable BACKUP_AGE_RECIPIENTS, secret BACKUP_RESTORE_KEY): self-test only, NO backup kept. See SECURITY-PLAN §7.1."
          fi
      - name: Dump staging (roles, schema, data)
        run: |
          set -euo pipefail
          supabase link --project-ref "$SUPABASE_PROJECT_REF" > /dev/null
          mkdir -p /tmp/dump
          supabase db dump --linked -f /tmp/dump/roles.sql --role-only > /dev/null
          supabase db dump --linked -f /tmp/dump/schema.sql > /dev/null
          supabase db dump --linked -f /tmp/dump/data.sql --use-copy --data-only > /dev/null
          ls -l /tmp/dump | awk 'NR>1 {print $5, $9}'
      - name: Row counts on the live project (for the restore check)
        if: env.RESTORE_TEST == 'true' || steps.keys.outputs.mode == 'self-test'
        run: |
          set -euo pipefail
          node scripts/backup-row-counts.mjs remote > /tmp/counts-live.txt
          wc -l < /tmp/counts-live.txt | xargs echo "tables counted:"
      - name: Encrypt
        run: |
          set -euo pipefail
          stamp=$(TZ=America/Port_of_Spain date +%Y-%m-%d-%H%M)
          echo "STAMP=$stamp" >> "$GITHUB_ENV"
          tar -C /tmp/dump -czf - roles.sql schema.sql data.sql | age ${{ steps.keys.outputs.args }} -o "/tmp/runlime-staging-$stamp.tar.gz.age"
          shred -u /tmp/dump/*.sql
          ls -l /tmp/*.age | awk '{print $5, $9}'
      - name: Keep 30 days (encrypted)
        if: steps.keys.outputs.mode == 'real'
        uses: actions/upload-artifact@v7
        with:
          name: runlime-staging-backup-${{ env.STAMP }}
          path: /tmp/runlime-staging-${{ env.STAMP }}.tar.gz.age
          retention-days: 30
          compression-level: 0
      - name: Restore test — decrypt into a fresh local database and compare row counts
        if: env.RESTORE_TEST == 'true' || steps.keys.outputs.mode == 'self-test'
        run: bash scripts/backup-restore-test.sh "/tmp/runlime-staging-$STAMP.tar.gz.age"
      - name: Summary
        if: always()
        run: |
          {
            echo "### Backup ${STAMP:-not made} (${{ steps.keys.outputs.mode }})"
            [ "${{ steps.keys.outputs.mode }}" = "real" ] && echo "- Kept 30 days as an encrypted artifact (owner key + restore-test key)." || echo "- Self-test only: nothing kept. Add the keys to start real backups."
            [ -f /tmp/restore-result.txt ] && { echo '```'; cat /tmp/restore-result.txt; echo '```'; } || true
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Clean up
        if: always()
        run: rm -f /tmp/restore.key /tmp/*.age; shred -u /tmp/dump/*.sql 2>/dev/null || true
