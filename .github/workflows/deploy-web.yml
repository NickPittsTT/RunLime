# Deploys the web portal (organiser/admin portal + legal pages) to Cloudflare Workers (FREE plan) via OpenNext.
# staging: automatically after CI passes on main, or manually from Actions → "Deploy web".
# Needs, in the GitHub "staging" environment: secret CLOUDFLARE_API_TOKEN, variable CLOUDFLARE_ACCOUNT_ID
# (see docs/phase-2/PLAN.md, items 15–17), plus the existing SUPABASE_PROJECT_REF, SUPABASE_ANON_KEY, SUPABASE_ACCESS_TOKEN.
# No custom domain: the site is served at https://runlime-web-staging.<your-subdomain>.workers.dev.
name: Deploy web

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-web-staging
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      # Guard: until the owner has added the Cloudflare settings, skip cleanly instead of failing.
      - name: Check deploy settings (names only, never values)
        id: check
        env:
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: |
          missing=()
          [ -n "$CLOUDFLARE_API_TOKEN" ] || missing+=("secret CLOUDFLARE_API_TOKEN")
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || missing+=("variable CLOUDFLARE_ACCOUNT_ID")
          [ -n "$SUPABASE_PROJECT_REF" ] || missing+=("variable SUPABASE_PROJECT_REF")
          [ -n "$SUPABASE_ANON_KEY" ] || missing+=("variable SUPABASE_ANON_KEY")
          if [ ${#missing[@]} -gt 0 ]; then
            printf '::notice::Web deploy skipped: not configured yet (%s)\n' "$(IFS=', '; echo "${missing[*]}")"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.check.outputs.ready == 'true'
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - if: steps.check.outputs.ready == 'true'
        uses: pnpm/action-setup@v5
      - if: steps.check.outputs.ready == 'true'
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - if: steps.check.outputs.ready == 'true'
        run: pnpm install --frozen-lockfile

      - name: Build for Cloudflare Workers (OpenNext)
        if: steps.check.outputs.ready == 'true'
        run: pnpm --filter @runlime/web cf:build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://${{ vars.SUPABASE_PROJECT_REF }}.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.STAGING_WEB_URL }}

      - name: Free-plan size check (Workers Free allows 3 MiB compressed)
        if: steps.check.outputs.ready == 'true'
        working-directory: apps/web
        run: node ../../scripts/check-worker-size.mjs

      - name: Deploy to Cloudflare Workers
        id: deploy
        if: steps.check.outputs.ready == 'true'
        working-directory: apps/web
        run: |
          set -o pipefail
          npx opennextjs-cloudflare deploy 2>&1 | tee deploy.log
          url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1)
          if [ -z "$url" ]; then echo "::error::Deployed, but no workers.dev URL found. Check that a workers.dev subdomain is set (PLAN.md item 15)."; exit 1; fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          { echo "### Web (staging) deployed"; echo; echo "- URL: $url"; echo "- Legal pages: $url/legal/terms"; } >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke test (home and legal pages respond)
        if: steps.check.outputs.ready == 'true'
        env:
          URL: ${{ steps.deploy.outputs.url }}
        # A new workers.dev subdomain/route can take a minute or two to go live, so retry for up to ~3 minutes.
        run: |
          for path in / /legal/terms /legal/privacy; do
            for i in $(seq 1 18); do
              code=$(curl -s -o /dev/null -w '%{http_code}' "$URL$path")
              [ "$code" = "200" ] && break
              sleep 10
            done
            echo "$path → HTTP $code"
            [ "$code" = "200" ] || exit 1
          done

      - name: Legal settings check (lists any placeholder still "not yet set"; values come from app_settings)
        if: steps.check.outputs.ready == 'true'
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          missing=""
          for slug in privacy terms moderation child-safety health community-times; do
            found=$(curl -s "$URL/legal/$slug" | grep -oE '\[[a-z ]+ — not yet set\]' | sort -u | tr '\n' ' ')
            [ -n "$found" ] && missing="$missing /legal/$slug: $found;"
          done
          found=$(curl -s "$URL/support" | grep -oE '\[[a-z ]+ — not yet set\]' | sort -u | tr '\n' ' ')
          [ -n "$found" ] && missing="$missing /support: $found;"
          if [ -n "$missing" ]; then
            echo "::warning::Legal settings not set yet:$missing"
            { echo; echo "- Legal settings not set yet:$missing"; } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "All legal placeholders are filled."
            { echo; echo "- Legal settings: all placeholders filled"; } >> "$GITHUB_STEP_SUMMARY"
          fi

      # Edge Functions only answer browser calls from allowed origins (CORS). Point them at the deployed site.
      - if: steps.check.outputs.ready == 'true' && env.SUPABASE_ACCESS_TOKEN != ''
        uses: supabase/setup-cli@v2
        with:
          version: 2.120.0
      - name: Allow the staging site to call Edge Functions (ALLOWED_ORIGINS)
        if: steps.check.outputs.ready == 'true' && env.SUPABASE_ACCESS_TOKEN != ''
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: supabase secrets set "ALLOWED_ORIGINS=$URL" --project-ref "$SUPABASE_PROJECT_REF"
