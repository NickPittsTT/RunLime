# Result of an EAS build: status, APK link and signing SHA-1 when finished; error and log tail when it failed.
# Uses EXPO_TOKEN; prints no secrets. Leave the build ID empty for the latest Android build.
name: Mobile build logs

on:
  workflow_dispatch:
    inputs:
      build_id:
        description: EAS build ID (from the build page URL); empty = latest Android build
        required: false

jobs:
  logs:
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build status, error and failing-phase log tail
        working-directory: apps/mobile
        env:
          BUILD_ID: ${{ inputs.build_id }}
        run: |
          set -uo pipefail
          if [ -z "${BUILD_ID}" ]; then
            BUILD_ID=$(npx --yes eas-cli@24.12.1 build:list --platform android --limit 1 --json --non-interactive | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>process.stdout.write(JSON.parse(s)[0].id))")
          fi
          echo "build: $BUILD_ID"
          npx --yes eas-cli@24.12.1 build:view "$BUILD_ID" --json > /tmp/build.json 2>/tmp/err.txt || { cat /tmp/err.txt; npx --yes eas-cli@24.12.1 build:view "$BUILD_ID" 2>&1 | tail -40; exit 1; }
          url=$(node -e "const b=require('/tmp/build.json');process.stdout.write((b.artifacts&&b.artifacts.buildUrl)||'')")
          if [ -n "$url" ]; then
            curl -fsSL "$url" -o /tmp/app.apk
            signer=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
            raw=$("$signer" verify --print-certs /tmp/app.apk | grep -m1 'certificate SHA-1 digest' | sed 's/.*digest: *//')
            sha1=$(echo "$raw" | tr 'a-f' 'A-F' | sed 's/../&:/g; s/:$//')
            printf '### Android build %s: FINISHED\n\n- APK (open on your phone): %s\n- Signing SHA-1: `%s`\n' "$BUILD_ID" "$url" "$sha1" | tee -a "$GITHUB_STEP_SUMMARY"
            # Push readiness: google-services.json becomes string resources; print only the (public) project ID.
            aapt2=$(ls -d "$ANDROID_HOME"/build-tools/*/aapt2 2>/dev/null | sort -V | tail -1)
            project=$("$aapt2" dump resources /tmp/app.apk 2>/dev/null | grep -A1 'string/project_id' | grep -o '"[^"]*"' | tr -d '"' | head -1)
            if [ -n "$project" ]; then firebase="yes (project $project)"; else firebase="no (phone notifications off in this build)"; fi
            printf -- '- Firebase config in the APK: %s\n' "$firebase" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          node - <<'JS'
          const b = require('/tmp/build.json');
          console.log('status:', b.status, '| platform:', b.platform, '| profile:', b.buildProfile);
          console.log('error:', JSON.stringify(b.error ?? null));
          if (!b.error) process.exit(0);
          (async () => {
            for (const url of b.logFiles ?? []) {
              const text = await (await fetch(url)).text();
              const lines = text.split('\n').filter(Boolean).map((l) => { try { return JSON.parse(l); } catch { return { msg: l }; } });
              const failedPhase = [...lines].reverse().find((l) => l.result === 'fail' || l.marker === 'END_PHASE' && l.result === 'fail')?.phase;
              const relevant = failedPhase ? lines.filter((l) => l.phase === failedPhase) : lines;
              console.log(`\n===== log file (${lines.length} lines) failing phase: ${failedPhase ?? 'unknown'} — last 150 lines =====`);
              for (const l of relevant.slice(-150)) console.log(`[${l.phase ?? ''}] ${l.msg ?? ''}`);
            }
          })();
          JS
