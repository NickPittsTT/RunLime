# Android build on Expo's servers (EAS free tier). Run from Actions → "Mobile build (Android)".
# profile=staging: standalone internal APK (code inside; install from a link). profile=development: needs a dev server.
# Needs (see docs/phase-2/PLAN.md): secret EXPO_TOKEN; variables SUPABASE_PROJECT_REF, SUPABASE_ANON_KEY;
# the Expo project ID is fixed in apps/mobile/app.config.ts;
# optional variables GOOGLE_WEB_CLIENT_ID, STAGING_WEB_URL.
name: Mobile build (Android)

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Build profile
        type: choice
        options: [staging, development]
        default: staging
      wait:
        description: Wait for the build to finish (costs ~15 Actions minutes). Otherwise get the APK from "Mobile build logs".
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment: staging
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      APP_ENV: ${{ inputs.profile }}
      EAS_ENVIRONMENT: ${{ inputs.profile == 'staging' && 'preview' || 'development' }}
      EAS: npx --yes eas-cli@24.12.1
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Check required settings are in place (names only, never values)
        env:
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: |
          missing=()
          [ -n "$EXPO_TOKEN" ] || missing+=("secret EXPO_TOKEN")
          [ -n "$SUPABASE_PROJECT_REF" ] || missing+=("variable SUPABASE_PROJECT_REF (staging environment)")
          [ -n "$SUPABASE_ANON_KEY" ] || missing+=("variable SUPABASE_ANON_KEY")
          if [ ${#missing[@]} -gt 0 ]; then printf '::error::Missing: %s\n' "${missing[@]}"; exit 1; fi

      - name: Sync public build settings to the EAS environment for this profile
        working-directory: apps/mobile
        env:
          SUPABASE_URL: https://${{ vars.SUPABASE_PROJECT_REF }}.supabase.co
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
          GOOGLE_WEB_CLIENT_ID: ${{ vars.GOOGLE_WEB_CLIENT_ID }}
          STAGING_WEB_URL: ${{ vars.STAGING_WEB_URL }}
        run: |
          set -euo pipefail
          put() { [ -n "$2" ] && $EAS env:set "$EAS_ENVIRONMENT" --name "$1" --value "$2" --visibility plaintext --scope project --non-interactive >/dev/null && echo "set $1"; }
          put EXPO_PUBLIC_SUPABASE_URL "$SUPABASE_URL"
          put EXPO_PUBLIC_SUPABASE_ANON_KEY "$SUPABASE_ANON_KEY"
          put EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID "$GOOGLE_WEB_CLIENT_ID" || echo "GOOGLE_WEB_CLIENT_ID not set yet: Google button will be hidden"
          put EXPO_PUBLIC_WEB_URL "$STAGING_WEB_URL" || echo "STAGING_WEB_URL not set yet: legal links will not open"

      - name: Start the build on EAS (no waiting; saves Actions minutes)
        if: ${{ !inputs.wait }}
        working-directory: apps/mobile
        run: |
          set -euo pipefail
          $EAS build --profile "${{ inputs.profile }}" --platform android --non-interactive --no-wait --json > build.json
          node -e "
            const b=[].concat(require('./build.json'))[0]||{};
            const lines=['### Android ${{ inputs.profile }} build started','','- Build ID: '+(b.id||'n/a'),'- Build page: https://expo.dev/accounts/runlimes-team/projects/runlime/builds/'+(b.id||''),'- When it finishes (usually 15–30 min), run **Mobile build logs** with this build ID for the APK link and signing SHA-1.'];
            console.log(lines.join('\n'));
            require('fs').appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join('\n')+'\n');
          "

      - name: Build on EAS and wait for the result (free queue ~15–30 min)
        if: ${{ inputs.wait }}
        working-directory: apps/mobile
        timeout-minutes: 150  # free queue has taken 35–60+ min
        run: |
          set -uo pipefail
          $EAS build --profile "${{ inputs.profile }}" --platform android --non-interactive --wait --json > build.json; code=$?
          node -e "
            const b=[].concat(require('./build.json'))[0]||{};
            const lines=['### Android ${{ inputs.profile }} build: '+(b.status||'unknown'),'','- Build page: '+(b.buildDetailsPageUrl||'n/a'),'- APK (open on your phone): '+((b.artifacts&&b.artifacts.buildUrl)||'not available'),'- Error: '+((b.error&&b.error.message)||'none')];
            console.log(lines.join('\n'));
            require('fs').appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join('\n')+'\n');
          " || cat build.json
          exit $code

      - name: Signing certificate of the APK (SHA-1 for the Google Android OAuth client)
        if: ${{ success() && inputs.wait }}
        working-directory: apps/mobile
        run: |
          url=$(node -e "const b=[].concat(require('./build.json'))[0]||{};process.stdout.write((b.artifacts&&b.artifacts.buildUrl)||'')")
          if [ -z "$url" ]; then echo "No APK URL"; exit 0; fi
          curl -fsSL "$url" -o app.apk
          signer=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
          if [ -n "$signer" ]; then
            # apksigner prints lowercase hex without colons; Google Cloud wants AA:BB:… form.
            raw=$("$signer" verify --print-certs app.apk | grep -m1 'certificate SHA-1 digest' | sed 's/.*digest: *//')
            sha1=$(echo "$raw" | tr 'a-f' 'A-F' | sed 's/../&:/g; s/:$//')
          else
            sha1=$(keytool -printcert -jarfile app.apk | grep -m1 'SHA1:' | sed 's/.*SHA1: *//')
          fi
          echo "APK signing SHA-1: $sha1"
          { echo; echo "- APK signing SHA-1 (Google Android OAuth client): \`$sha1\`"; } >> "$GITHUB_STEP_SUMMARY"
