# Read-only diagnostics against staging (no secrets printed). Run from Actions → "Staging diagnostics".
#  - api-cache-headers: response headers the app receives for a public calendar query (caching investigation)
#  - event-history: events matching a name, with status and change history (also finds near-duplicate names)
#  - security-baseline: confirms the 2026-10-24 hardening migration and grants are live (read-only)
#  - security-advisor: Supabase Security Advisor on staging (Management API); fails on ERROR
#  - push: phone-notification delivery (tokens masked, sent status, cron runs, function responses, Expo credentials);
#    send_test also sends one test notification to each registered phone and prints the Expo ticket + receipt
name: Staging diagnostics

on:
  workflow_dispatch:
    inputs:
      check:
        description: What to check
        type: choice
        options: [api-cache-headers, event-history, photos, push, security-advisor, security-baseline]
        default: api-cache-headers
      name:
        description: Event name fragment (event-history only)
        required: false
      send_test:
        description: push only — send one test notification to each registered phone
        type: boolean
        default: false

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    environment: staging
    steps:
      - uses: actions/checkout@v5
        if: inputs.check != 'api-cache-headers'
      - name: Security baseline live on staging (read-only)
        if: inputs.check == 'security-baseline'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        run: node scripts/staging-security-check.mjs
      - name: Photo visibility (read-only; accounts as letters)
        if: inputs.check == 'photos'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        run: node scripts/photo-diagnostics.mjs
      - name: Security Advisor (hosted)
        if: inputs.check == 'security-advisor'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        run: node scripts/hosted-advisor.mjs
      - name: Push delivery diagnostics
        if: inputs.check == 'push'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          SEND_TEST: ${{ inputs.send_test }}
        run: node scripts/push-diagnostics.mjs
      - name: Event status and change history
        if: inputs.check == 'event-history'
        env:
          SUPABASE_URL: https://${{ vars.SUPABASE_PROJECT_REF }}.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NAME: ${{ inputs.name }}
        run: node scripts/event-history.mjs "$NAME"
      - name: Calendar query response headers (anon key, public data only)
        if: inputs.check == 'api-cache-headers'
        env:
          URL: https://${{ vars.SUPABASE_PROJECT_REF }}.supabase.co
          ANON: ${{ secrets.SUPABASE_ANON_KEY || vars.SUPABASE_ANON_KEY }}
        run: |
          for i in 1 2; do
            echo "--- request $i"
            curl -sS -D - -o /dev/null "$URL/rest/v1/events?select=id,status&status=in.(published,postponed,cancelled)&limit=5" \
              -H "apikey: $ANON" -H "Authorization: Bearer $ANON" | grep -viE '^(set-cookie|sb-|x-sb-)'
          done
