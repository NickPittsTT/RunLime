# Phase 5 emulator check: start a run. The script then replays a 1 km route in 250 steps of 4 m (runner speed)
# and reads the live distance from the screen. Maestro's travel command is not used: it moved in 22 m jumps
# (about 10-12 m/s), which the app rightly treats as impossible running.
appId: tt.runlime.app.dev
---
- setLocation:
    latitude: 10.6505
    longitude: -61.5000
- openLink: runlime://run
- extendedWaitUntil:
    visible: Start
    timeout: 30000
- tapOn: Start
- extendedWaitUntil:
    visible: Distance
    timeout: 30000
- takeScreenshot: 20-run-started
- extendedWaitUntil:
    visible: Stop
    timeout: 10000
